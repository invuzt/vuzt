edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.92"
# Tambahkan fitur css dan style di sini
web-sys = { version = "0.3.69", features = [
    "HtmlElement", 
    "Document", 
    "Window", 
    "Element", 
    "CssStyleDeclaration"
] }
