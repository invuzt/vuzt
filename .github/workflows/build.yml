name: Build Android APK (Mozilla Rust Plugin)

on:
  push:
    branches: [ main, master, invuzt/binary ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Kita hanya siapkan SDK, biarkan Gradle download NDK sendiri
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: |
          # Hapus local.properties agar tidak ada info folder yang salah/hardcoded
          rm -f local.properties
          
          chmod +x gradlew
          # Tambahkan flag untuk menerima lisensi SDK secara otomatis
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
