name: Build Android APK with Rust JNI

on:
  push:
    branches: [ main, master, invuzt/binary ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Rust JNI Library
        run: |
          cd rust_engine
          cargo install cargo-ndk
          # Ini akan otomatis mencari NDK dan melakukan linking yang benar
          cargo ndk -t arm64-v8a build --release
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust_engine/target/aarch64-linux-android/release/libpemanasan_jni.so app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
