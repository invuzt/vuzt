<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 15px; border-top: 4px solid #bb86fc; margin-bottom: 20px; }
        h2 { color: #bb86fc; font-size: 1.2em; margin-top: 0; }
        textarea { width: 100%; height: 100px; background: #2c2c2c; color: white; border: 1px solid #444; border-radius: 5px; padding: 10px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #bb86fc; color: #000; }
        .btn-read { background: #03dac6; color: #000; }
        #status { margin-top: 10px; font-size: 0.8em; color: #03dac6; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📝 RUST SECURE NOTES</h2>
        <textarea id="noteInput" placeholder="Tulis sesuatu di sini..."></textarea>
        <div class="btn-group">
            <button class="btn-save" onclick="simpan()">SIMPAN</button>
            <button class="btn-read" onclick="baca()">BACA</button>
        </div>
        <div id="status"></div>
    </div>

    <script>
        function simpan() {
            let teks = document.getElementById('noteInput').value;
            Android.saveNote(teks);
            document.getElementById('status').innerText = "✅ Tersimpan oleh Rust!";
        }

        function baca() {
            let hasil = Android.readNote();
            document.getElementById('noteInput').value = hasil;
            document.getElementById('status').innerText = "📂 Dibaca dari memori internal.";
        }
        
        // Baca otomatis saat buka
        window.onload = baca;
    </script>
</body>
</html>
