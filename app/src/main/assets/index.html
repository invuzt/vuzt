<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; margin: 0; }
        /* Sidebar */
        .sidenav { height: 100%; width: 0; position: fixed; z-index: 1; top: 0; left: 0; background-color: #1f1f1f; overflow-x: hidden; transition: 0.3s; padding-top: 60px; }
        .sidenav a { padding: 15px 25px; text-decoration: none; font-size: 1.2em; color: #888; display: block; transition: 0.3s; }
        .sidenav a:hover { color: #bb86fc; }
        .sidenav .closebtn { position: absolute; top: 0; right: 25px; font-size: 36px; margin-left: 50px; }
        /* Main Content */
        #main { transition: margin-left .3s; padding: 20px; }
        .page { display: none; }
        .active-page { display: block; }
        .hamburger { font-size: 30px; cursor: pointer; color: #bb86fc; }
        textarea { width: 100%; height: 150px; background: #2c2c2c; color: white; border-radius: 8px; padding: 10px; border: 1px solid #444; }
        button { background: #bb86fc; color: black; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="#" onclick="showPage('pageRam')">📊 RAM Info</a>
  <a href="#" onclick="showPage('pageNotes')">📝 Secure Notes</a>
</div>

<div id="main">
  <span class="hamburger" onclick="openNav()">&#9776; Menu</span>
  
  <div id="pageRam" class="page active-page">
    <h2>System Info</h2>
    <pre id="ramOutput">Klik refresh...</pre>
    <button onclick="refreshRam()">Refresh RAM</button>
  </div>

  <div id="pageNotes" class="page">
    <h2>Secure Notes</h2>
    <textarea id="noteInput"></textarea>
    <button onclick="simpanNote()">Simpan Catatan</button>
  </div>
</div>

<script>
function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
  document.getElementById(pageId).classList.add('active-page');
  closeNav();
  if(pageId === 'pageNotes') { 
      document.getElementById('noteInput').value = Android.readNote();
  }
}

function refreshRam() {
  let data = Android.getRamData();
  document.getElementById('ramOutput').innerText = data;
}

function simpanNote() {
  let teks = document.getElementById('noteInput').value;
  Android.saveNote(teks);
  alert("Tersimpan!");
}
</script>
</body>
</html>
