<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: monospace; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 15px; border-left: 5px solid #00e676; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #00e676; margin-top: 0; font-size: 1.2em; }
        pre { white-space: pre-wrap; word-wrap: break-word; color: #b0bec5; font-size: 0.9em; }
        button { background: #00e676; color: #121212; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 1em; cursor: pointer; }
        button:active { background: #00c853; transform: scale(0.98); }
        .critical { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2><span style="vertical-align:middle">⚡</span> SYSTEM DASHBOARD</h2>
        <pre id="output">Menunggu data...</pre>
    </div>

    <button onclick="Android.jalankanBinary()">REFRESH DATA</button>

    <script>
        function tampilkanData(data) {
            let log = document.getElementById('output');
            // Logika warna sederhana: jika baterai di bawah 20%
            if (data.includes("Level:") && parseInt(data.split("Level: ")[1]) < 20) {
                log.innerHTML = "<span class='critical'>" + data + "</span>";
            } else {
                log.innerText = data;
            }
        }
    </script>
</body>
</html>
