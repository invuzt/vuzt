<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="headerTitle">monitor</h1>
    </header>

    <div id="content-area">
        <div id="pageHome" class="page active">
            <div class="card">
                <div style="color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Usage Frequency</div>
                <div id="ramValue" style="font-size: 32px; font-weight: 300; margin: 12px 0; letter-spacing: -1px;">-- / --</div>
                <div id="graph" style="display:flex; align-items:flex-end; height:30px; gap:4px; margin-top:15px;">
                </div>
            </div>
        </div>

        <div id="pageNotes" class="page">
            <div id="noteList"></div>
        </div>
    </div>

    <div id="fab" onclick="openEditor()" style="display:none; position:fixed; right:30px; bottom:110px; color:var(--text-main); font-size:32px; font-weight:200; cursor:pointer;">+</div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('pageHome', 'monitor', this)">Monitor</div>
        <div class="nav-item" onclick="nav('pageNotes', 'notes', this)">Notes</div>
    </nav>

    <div id="editor" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--surface); z-index:100; padding:60px 30px;">
        <input type="text" id="noteTitle" placeholder="Entry Title" style="width:100%; background:none; border:none; color:var(--text-main); font-size:28px; font-weight:600; margin-bottom:30px; outline:none; border-bottom: 1px solid var(--border); padding-bottom:10px;">
        <textarea id="noteContent" placeholder="Describe..." style="width:100%; height:60%; background:none; border:none; color:var(--accent); font-size:18px; outline:none; resize:none; line-height:1.6;"></textarea>
        <div style="display:flex; gap:20px; margin-top:30px;">
            <button onclick="closeEditor()" style="flex:1; background:none; border:1px solid var(--border); padding:18px; border-radius:8px; font-size:14px;">Dismiss</button>
            <button onclick="saveNote()" style="flex:2; background:var(--primary); color:white; border:none; padding:18px; border-radius:8px; font-size:14px; font-weight:600;">Confirm</button>
        </div>
    </div>

    <script>
        function nav(pageId, title, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
            document.getElementById('headerTitle').innerText = title;
            document.getElementById('fab').style.display = (pageId === 'pageNotes') ? 'block' : 'none';
            if(pageId === 'pageNotes') renderNotes();
        }

        function updateRam() {
            try {
                let data = Android.getRamData().split('|');
                let usedGB = ((data[0]-data[1])/1024/1024).toFixed(1);
                let totalGB = (data[0]/1024/1024).toFixed(1);
                document.getElementById('ramValue').innerText = `${usedGB} / ${totalGB} GB`;
                
                let bar = document.createElement('div');
                bar.style.flex = '1';
                bar.style.background = 'var(--primary)';
                bar.style.height = (1 - (data[1]/data[0])) * 100 + '%';
                bar.style.opacity = '0.1';
                let graph = document.getElementById('graph');
                graph.appendChild(bar);
                if(graph.children.length > 25) graph.removeChild(graph.firstChild);
            } catch(e) {}
        }
        setInterval(updateRam, 2000);

        function renderNotes() {
            let container = document.getElementById('noteList');
            let raw = Android.getAllNotes();
            container.innerHTML = '';
            if(!raw) return;
            raw.split('|').forEach(file => {
                if(!file) return;
                let div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `<div onclick="openEditor('${file}')" style="font-weight:500;">${file.replace('.txt','').toLowerCase()}</div>
                                 <div onclick="deleteNote('${file}')" style="color:var(--text-dim); font-size:12px;">remove</div>`;
                container.appendChild(div);
            });
        }

        function openEditor(file = null) {
            currentEditingFile = file;
            if(file) {
                document.getElementById('noteTitle').value = file.replace('.txt','');
                document.getElementById('noteContent').value = Android.readNote(file);
            } else {
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
            }
            document.getElementById('editor').style.display = 'block';
        }

        function closeEditor() { document.getElementById('editor').style.display = 'none'; }

        function saveNote() {
            let title = document.getElementById('noteTitle').value;
            let content = document.getElementById('noteContent').value;
            if(!title) return;
            Android.saveNote(title + '.txt', content);
            closeEditor();
            renderNotes();
        }

        function deleteNote(file) {
            if(confirm('Delete this entry?')) {
                Android.deleteNote(file);
                renderNotes();
            }
        }
    </script>
</body>
</html>
