<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="headerTitle">Dashboard</h1>
    </header>

    <div id="content-area">
        <div id="pageHome" class="page active">
            <div class="card">
                <div style="color: var(--text-dim); font-size: 12px;">Memory Usage</div>
                <div id="ramValue" style="font-size: 28px; font-weight: 700; margin: 8px 0;">-- / --</div>
                <div id="graph" style="display:flex; align-items:flex-end; height:40px; gap:3px;">
                    </div>
            </div>
        </div>

        <div id="pageNotes" class="page">
            <div id="noteList"></div>
            <div style="height: 80px;"></div> </div>
    </div>

    <button id="fab" onclick="openEditor()" style="display:none; position:fixed; right:24px; bottom:100px; width:56px; height:56px; border-radius:28px; background:var(--primary); border:none; font-size:24px; box-shadow:0 8px 16px rgba(0,0,0,0.4);">+</button>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('pageHome', 'Dashboard', this)">
            <i>📊</i><span>System</span>
        </div>
        <div class="nav-item" onclick="nav('pageNotes', 'Vault', this)">
            <i>📝</i><span>Notes</span>
        </div>
    </nav>

    <div id="editor" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:100; padding:40px 20px;">
        <input type="text" id="noteTitle" placeholder="Title" style="width:100%; background:none; border:none; color:white; font-size:24px; margin-bottom:20px; outline:none;">
        <textarea id="noteContent" placeholder="Start typing..." style="width:100%; height:70%; background:none; border:none; color:var(--text-dim); font-size:16px; outline:none; resize:none;"></textarea>
        <div style="display:flex; gap:10px;">
            <button onclick="closeEditor()" style="flex:1; background:var(--surface); color:white; border:none; padding:15px; border-radius:12px;">Cancel</button>
            <button onclick="saveNote()" style="flex:2; background:var(--primary); color:black; border:none; padding:15px; border-radius:12px; font-weight:600;">Save</button>
        </div>
    </div>

    <script>
        function nav(pageId, title, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
            document.getElementById('headerTitle').innerText = title;
            document.getElementById('fab').style.display = (pageId === 'pageNotes') ? 'block' : 'none';
            if(pageId === 'pageNotes') renderNotes();
        }

        // RAM Logika (Minimalis)
        function updateRam() {
            try {
                let data = Android.getRamData().split('|');
                document.getElementById('ramValue').innerText = `${(data[1]/1024/1024).toFixed(1)}GB / ${(data[0]/1024/1024).toFixed(1)}GB`;
                // Simple Graph
                let bar = document.createElement('div');
                bar.style.width = '100%';
                bar.style.background = 'var(--primary)';
                bar.style.height = (1 - (data[1]/data[0])) * 100 + '%';
                bar.style.borderRadius = '2px';
                let graph = document.getElementById('graph');
                graph.appendChild(bar);
                if(graph.children.length > 20) graph.removeChild(graph.firstChild);
            } catch(e) {}
        }
        setInterval(updateRam, 2000);

        // Notes Logika (Minimalis)
        let currentEditingFile = null;
        function renderNotes() {
            let container = document.getElementById('noteList');
            let raw = Android.getAllNotes();
            container.innerHTML = '';
            if(!raw) return;
            raw.split('|').forEach(file => {
                if(!file) return;
                let div = document.createElement('div');
                div.className = 'card';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.innerHTML = `<div onclick="openEditor('${file}')">${file.replace('.txt','')}</div>
                                 <div onclick="deleteNote('${file}')" style="color:#ff5252">✕</div>`;
                container.appendChild(div);
            });
        }

        function openEditor(file = null) {
            currentEditingFile = file;
            if(file) {
                document.getElementById('noteTitle').value = file.replace('.txt','');
                document.getElementById('noteContent').value = Android.readNote(file);
            } else {
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
            }
            document.getElementById('editor').style.display = 'block';
        }

        function closeEditor() { document.getElementById('editor').style.display = 'none'; }

        function saveNote() {
            let title = document.getElementById('noteTitle').value;
            let content = document.getElementById('noteContent').value;
            if(!title) return;
            Android.saveNote(title + '.txt', content);
            closeEditor();
            renderNotes();
        }

        function deleteNote(file) {
            if(confirm('Delete?')) {
                Android.deleteNote(file);
                renderNotes();
            }
        }
    </script>
</body>
</html>
