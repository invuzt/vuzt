<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS Tambahan agar persis iOS */
        :root { --bg: #F2F2F7; --white: #FFF; --blue: #007AFF; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 20px 16px; }
        h1 { font-size: 34px; margin: 0 0 20px 8px; }
        .group { background: var(--white); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid #C6C6C8; position: relative; }
        .row:last-child { border-bottom: none; }
        .details { display: none; padding: 12px 16px; background: #FAFAFA; font-size: 14px; color: #666; }
        .switch { width: 51px; height: 31px; background: #4CD964; border-radius: 15.5px; position: relative; }
        .switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; background: #FFF; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        .slider-container { flex: 1; margin: 0 15px; position: relative; display: flex; align-items: center; }
        .slider-input { width: 100%; -webkit-appearance: none; background: #D1D1D6; height: 4px; border-radius: 2px; outline: none; }
        .slider-input::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #FFF; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
        .large-btn { width: 100%; background: var(--blue); color: #FFF; border: none; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>UI elements</h1>

    <div class="group">
        <div class="row" onclick="handleAcc('acc1')"><span>Primary</span><div class="arrow"></div></div>
        <div id="acc1" class="details"></div>
        <div class="row" onclick="handleAcc('acc2')"><span>Secondary</span><div class="arrow"></div></div>
        <div id="acc2" class="details"></div>
    </div>

    <div class="group">
        <div class="row">
            <span>Switch</span>
            <div class="switch"></div>
        </div>
    </div>

    <div class="group">
        <div class="row" style="border:none">
            <span id="turt">🐢</span>
            <div class="slider-container">
                <input type="range" class="slider-input" min="0" max="100" value="40" oninput="handleSliderMove(this.value)">
            </div>
            <span id="rabb">🐇</span>
        </div>
    </div>

    <button class="large-btn">Large Button</button>

    <script type="module">
        import init, { handle_slider, get_accordion_content } from './wasm_pkg/vuzt_wasm.js';

        async function run() {
            await init();
            console.log("WASM Ready");
        }
        run();

        window.handleSliderMove = (v) => {
            handle_slider(parseFloat(v));
        };

        window.handleAcc = (id) => {
            const el = document.getElementById(id);
            const isVisible = el.style.display === 'block';
            el.style.display = isVisible ? 'none' : 'block';
            if (!isVisible) {
                el.innerText = get_accordion_content(id);
            }
        };
    </script>
</body>
</html>
