<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="headerTitle">activity</h1>
    </header>

    <div id="content-area">
        <div id="pageHome" class="page active">
            <div class="grid">
                <div class="card blue">
                    <div class="card-label">Files Saved</div>
                    <div class="card-value" id="fileCount">0</div>
                </div>
                <div class="card purple">
                    <div class="card-label">Data Vol</div>
                    <div class="card-value" id="dataVol">0</div>
                </div>
            </div>
            <div class="section-title">Quick Actions</div>
            <div class="note-item" onclick="openEditor()">
                <div style="font-weight:600">Create New Entry</div>
                <div style="font-size:20px">+</div>
            </div>
        </div>

        <div id="pageNotes" class="page">
            <div class="section-title">All Vaults</div>
            <div id="noteList"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('pageHome', 'activity', this)">Activity</div>
        <div class="nav-item" onclick="nav('pageNotes', 'vaults', this)">Vaults</div>
    </nav>

    <div id="editor">
        <input type="text" id="noteTitle" placeholder="Filename" style="width:100%; border:none; font-size:32px; font-weight:800; outline:none; margin-bottom:20px;">
        <textarea id="noteContent" placeholder="Write here..." style="width:100%; height:60%; border:none; font-size:18px; outline:none; resize:none; line-height:1.6;"></textarea>
        <div style="display:flex; gap:15px; margin-top:40px;">
            <button onclick="closeEditor()" style="flex:1; padding:20px; border-radius:15px; border:1px solid #EEE; background:none; font-weight:700;">Discard</button>
            <button onclick="saveNote()" style="flex:2; padding:20px; border-radius:15px; border:none; background:#1D1D1F; color:white; font-weight:700;">Save Entry</button>
        </div>
    </div>

    <script>
        function nav(pageId, title, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
            document.getElementById('headerTitle').innerText = title;
            if(pageId === 'pageNotes') renderNotes();
            if(pageId === 'pageHome') updateStats();
        }

        function updateStats() {
            try {
                let stats = Android.getRamData().split('|'); // Fungsi JNI tetap sama namanya, isinya saja yang berubah
                document.getElementById('fileCount').innerText = stats[0];
                document.getElementById('dataVol').innerText = (stats[1] > 1000) ? (stats[1]/1000).toFixed(1) + "k" : stats[1];
            } catch(e) {}
        }

        function renderNotes() {
            let container = document.getElementById('noteList');
            let raw = Android.getAllNotes();
            container.innerHTML = '';
            if(!raw) return;
            raw.split('|').forEach(file => {
                if(!file) return;
                let div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `<div onclick="openEditor('${file}')" style="font-weight:600;">${file.replace('.txt','')}</div>
                                 <div onclick="deleteNote('${file}')" style="color:#FF3B30; font-size:12px; font-weight:700;">DEL</div>`;
                container.appendChild(div);
            });
        }

        function openEditor(file = null) {
            if(file) {
                document.getElementById('noteTitle').value = file.replace('.txt','');
                document.getElementById('noteContent').value = Android.readNote(file);
            } else {
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
            }
            document.getElementById('editor').style.display = 'block';
        }

        function closeEditor() { document.getElementById('editor').style.display = 'none'; }

        function saveNote() {
            let title = document.getElementById('noteTitle').value;
            let content = document.getElementById('noteContent').value;
            if(!title) return;
            Android.saveNote(title + '.txt', content);
            closeEditor();
            updateStats();
            renderNotes();
        }

        function deleteNote(file) {
            if(confirm('Delete?')) {
                Android.deleteNote(file);
                renderNotes();
                updateStats();
            }
        }
        window.onload = updateStats;
    </script>
</body>
</html>
