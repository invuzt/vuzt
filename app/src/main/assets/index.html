<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust RAM Monitor</title>
    <style>
        body { background: #121212; color: #00ff00; font-family: monospace; padding: 20px; }
        .box { border: 1px solid #333; padding: 15px; border-radius: 8px; background: #1a1a1a; }
        h2 { color: #ff9f0a; margin-top: 0; }
        #output { white-space: pre-wrap; font-size: 1.2rem; line-height: 1.5; }
        button { 
            background: #ff9f0a; border: none; padding: 12px; width: 100%; 
            color: white; font-weight: bold; border-radius: 5px; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>System Info (Native Rust)</h2>
        <div id="output">Menunggu data dari binary...</div>
    </div>
    
    <button onclick="updateRAM()">REFRESH RAM</button>

    <script>
        // Fungsi ini akan dipanggil oleh Java
        function tampilkanData(data) {
            document.getElementById('output').innerText = data;
        }

        function updateRAM() {
            // Memanggil fungsi di Java (Interface: Android)
            if(window.Android) {
                window.Android.jalankanBinary();
            }
        }
        
        // Jalankan sekali saat startup
        window.onload = updateRAM;
    </script>
</body>
</html>
